<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学食ガチャ</title>
  <meta name="description" content="予算を決めて、今日の学食メニューをガチャで決めよう。">
  <!-- style.css / app.js を変えたら ?v= の数字を上げる（古いファイルがブラウザに残って動かなくなるのを防ぐ） -->
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <p class="eyebrow">今日なに食べる？</p>
      <h1>学食ガチャ</h1>
    </header>

    <section class="machine-area">
      <div class="machine-scale">
        <div class="machine" id="machine" aria-hidden="true">
          <div class="dome">
            <span class="ball b1"></span><span class="ball b2"></span><span class="ball b3"></span>
            <span class="ball b4"></span><span class="ball b5"></span><span class="ball b6"></span>
          </div>
          <div class="body">
            <div class="knob" id="knob"></div>
            <div class="slot-hole"></div>
          </div>
          <div class="capsule" id="capsule"><span></span></div>
          <div class="burst" id="burst"></div>
        </div>
      </div>
      <button class="spin" id="spin" type="button">ガチャを回す</button>
      <p class="status" id="status" role="status"></p>
    </section>

    <section class="panel quick" aria-label="食堂と予算">
      <div class="field">
        <span class="label">食堂</span>
        <div class="seg" id="cafeteria" role="radiogroup" aria-label="食堂"></div>
      </div>
      <div class="field">
        <label class="label" for="budget">予算</label>
        <div class="budget-row">
          <div class="budget">
            <span class="yen">¥</span>
            <input id="budget" type="number" inputmode="numeric" min="50" step="10" value="500">
          </div>
          <div class="chips" id="budgetChips"></div>
        </div>
      </div>
    </section>

    <details class="settings" id="settings">
      <summary>
        <span class="sum-main">
          <span class="sum-title">日にち・時間帯・ガチャのルール</span>
          <span class="sum-text" id="summary"></span>
        </span>
        <span class="sum-edit"></span>
      </summary>
      <div class="settings-body">
        <div class="row">
          <label class="field">
            <span class="label">日にち</span>
            <select id="date"></select>
          </label>
          <div class="field">
            <span class="label">時間帯</span>
            <div class="seg small" id="slot" role="radiogroup" aria-label="時間帯"></div>
          </div>
        </div>

        <div class="field opts">
          <span class="label">ガチャのルール</span>
          <label class="check"><input type="checkbox" id="requireMain"> 主食を1品は必ず入れる</label>
          <label class="check"><input type="checkbox" id="allowDup" checked> 同じメニューの重複OK（サラダ5つもありえる）</label>
        </div>
      </div>
    </details>

    <details class="lineup">
      <summary>この日のラインナップ <span id="lineupCount"></span></summary>
      <ul id="lineup"></ul>
    </details>

    <footer class="foot">
      <p id="dataInfo"></p>
      <p>メニューは <a id="srcLink" href="https://www.cit-s.com/dining/" target="_blank" rel="noopener">シー・アイ・ティ・サービスの公式ページ</a> のPDFをもとにしています。都合により変更されることがあります。非公式のサービスです。</p>
    </footer>
  </main>
  <!-- 演出用：カプセルが画面の中央に来て開き、光が画面を覆う -->
  <div class="stage" id="stage" aria-hidden="true" hidden>
    <div class="glow" id="glow"></div>
    <div class="cap" id="cap"><span class="cap-top"></span><span class="cap-bottom"></span></div>
  </div>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <dialog class="result" id="result" aria-labelledby="badge" tabindex="-1">
    <button type="button" class="close" id="close" aria-label="閉じる">×</button>
    <p class="badge" id="badge"></p>
    <ul class="picks" id="picks"></ul>
    <div class="total">
      <span>合計</span><strong id="total"></strong>
      <span class="rest" id="rest"></span>
    </div>
    <p class="caution">※ どのメニューも売り切れていることがあります。実際に食堂に行って確認してください。</p>
    <div class="actions">
      <button type="button" class="primary" id="again">もう一回</button>
      <button type="button" class="ghost" id="copy">結果をコピー</button>
    </div>
  </dialog>
  <script src="app.js?v=7"></script>
</body>
</html>
